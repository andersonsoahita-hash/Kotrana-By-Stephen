<style>
/* Concept : app mobile une colonne, fond bleu nuit, accent bleu ciel lumineux ; barre d'onglets en bas, feuilles modales. */
:root{
  --bg:#08111F; --surface:#0F1C31; --surface2:#16284A; --line:#223B63;
  --fg:#EAF4FF; --muted:#8CA6C6; --accent:#5CC8FF; --accent2:#A8E4FF; --ink:#04243B;
  --good:#47DDA0; --warn:#FFB454; --bad:#FF7F8F; --body:#1B3358; --hl:#5CC8FF; --hl2:#2D7FB3;
  --glow:rgba(92,200,255,.22); --shadow:0 10px 30px rgba(0,0,0,.35);
  --fd:'Sora',system-ui,sans-serif; --fb:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#EEF6FE; --surface:#FFFFFF; --surface2:#E3F0FC; --line:#C9DDF1;
  --fg:#0A2038; --muted:#4F6D8D; --accent:#0B84D6; --accent2:#5FC1F3; --ink:#FFFFFF;
  --good:#0E9F69; --warn:#C27500; --bad:#D0384D; --body:#CFE1F4; --hl:#0B84D6; --hl2:#86C5EE;
  --glow:rgba(11,132,214,.16); --shadow:0 10px 26px rgba(30,80,130,.14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#EEF6FE; --surface:#FFFFFF; --surface2:#E3F0FC; --line:#C9DDF1;
  --fg:#0A2038; --muted:#4F6D8D; --accent:#0B84D6; --accent2:#5FC1F3; --ink:#FFFFFF;
  --good:#0E9F69; --warn:#C27500; --bad:#D0384D; --body:#CFE1F4; --hl:#0B84D6; --hl2:#86C5EE;
  --glow:rgba(11,132,214,.16); --shadow:0 10px 26px rgba(30,80,130,.14); color-scheme:light}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1C31; --surface2:#16284A; --line:#223B63;
  --fg:#EAF4FF; --muted:#8CA6C6; --accent:#5CC8FF; --accent2:#A8E4FF; --ink:#04243B;
  --good:#47DDA0; --warn:#FFB454; --bad:#FF7F8F; --body:#1B3358; --hl:#5CC8FF; --hl2:#2D7FB3;
  --glow:rgba(92,200,255,.22); --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

html.ph{--phov:rgba(8,17,31,.60)}
@media (prefers-color-scheme:light){html.ph:not([data-theme="dark"]){--phov:rgba(238,246,254,.62)}}
html.ph[data-theme="light"]{--phov:rgba(238,246,254,.62)}html.ph[data-theme="dark"]{--phov:rgba(8,17,31,.60)}
html.ph::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--phov),var(--phov)),var(--ph) center top/cover no-repeat}
html.ph body{background:transparent}html.ph body::before{background:transparent}
html.ph .card,html.ph .kpi{background:color-mix(in srgb,var(--surface) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
html.ph .card.hero{background:linear-gradient(155deg,color-mix(in srgb,var(--surface2) 80%,transparent),color-mix(in srgb,var(--surface) 72%,transparent) 70%)}
html.ph .tabbar{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:520px;margin:0 auto;padding-block:14px 110px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 2px 10px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card.hero{background:linear-gradient(155deg,var(--surface2),var(--surface) 70%);box-shadow:var(--shadow),0 0 0 1px var(--glow) inset;position:relative;overflow:hidden}
.card.hero.ph{background:linear-gradient(100deg,rgba(5,16,36,.90) 0%,rgba(5,16,36,.62) 50%,rgba(5,16,36,.18) 100%),var(--ph) center 34%/cover no-repeat}
.card.hero.ph h3,.card.hero.ph p,.card.hero.ph .tiny,.card.hero.ph .muted{color:#EAF4FF}.card.hero.ph .tag{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.28);color:#EAF4FF}
.card.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 70%);pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;font-family:var(--fd);font-size:15px}
.btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--ink);box-shadow:0 8px 22px var(--glow)}
.btn.sec{background:var(--surface2);border:1px solid var(--line)}
.btn.ghost{border:1px solid var(--line);min-height:40px;font-size:13.5px;padding:0 14px;font-weight:600}
.btn.block{width:100%}.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.tag.p{background:var(--hl);color:var(--ink);border-color:var(--hl)}.tag.s{background:transparent;border-color:var(--hl2);color:var(--fg)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.brand b{font-family:var(--fd);font-size:20px;letter-spacing:.04em}
.logo{width:38px;height:38px;border-radius:12px;display:block}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.big{font-family:var(--fd);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:center}
.kpi .big{font-size:20px}.kpi small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.ring{width:58px;height:58px;margin:0 auto 6px;display:block}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}.ring .t{stroke:var(--surface2)}.ring .v{stroke:var(--accent);transition:stroke-dashoffset .5s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{text-align:center;padding:8px 2px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.day b{display:block;font-family:var(--fd);font-size:15px;color:var(--fg);margin:2px 0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.day.done{background:var(--accent);color:var(--ink);border-color:var(--accent)}.day.done b{color:var(--ink)}
.chk{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.chk:last-child{border-bottom:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.chk.on .box{background:var(--accent);border-color:var(--accent)}.chk.on .box::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk.on span:last-child{color:var(--muted);text-decoration:line-through}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
.tabs{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;color:var(--muted);font-size:11px;font-weight:600}
.tab.on{background:var(--surface2);color:var(--accent)}
.sheetbg{position:fixed;inset:0;z-index:40;background:rgba(2,8,18,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 12px;width:100%}
textarea{padding:10px 12px;min-height:90px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center;margin-bottom:8px}
.setrow .n{font-family:var(--fd);color:var(--muted);font-weight:700;text-align:center}
.setrow input{text-align:center;font-family:var(--fd);font-weight:600;font-size:17px;min-height:50px}
.setrow .ok{height:50px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.setrow.done .ok{background:var(--good);border-color:var(--good);color:var(--ink)}.setrow.done input{opacity:.7}
.bodyfig{width:100%;max-width:300px;display:block;margin:0 auto}
.bodyfig .b{fill:var(--body)}.bodyfig .m{fill:var(--body);stroke:var(--line);stroke-width:.6}.bodyfig .m.hl{fill:var(--hl);stroke:var(--hl)}.bodyfig .m.hl2{fill:var(--hl2);stroke:var(--hl2)}
.bodyfig text{fill:var(--muted);font-size:8px;font-family:var(--fb);text-anchor:middle;letter-spacing:.08em}
.excard{display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.mini{width:64px;flex:none;background:var(--surface2);border-radius:14px;padding:4px}
.list{display:flex;flex-direction:column;gap:10px}
ul.pts{margin:6px 0 0;padding-left:18px}ul.pts li{margin:4px 0}
.note{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:13.5px}
.rest{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;padding:0 max(16px,env(safe-area-inset-left,0px))}
.rest>div{max-width:520px;margin:0 auto;background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--ink);border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.rest b{font-family:var(--fd);font-size:28px;font-variant-numeric:tabular-nums;min-width:86px}
.rest button{background:rgba(255,255,255,.28);border-radius:12px;min-height:40px;padding:0 12px;font-weight:700}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:9.5px;font-family:var(--fb)}
svg.chart .g{stroke:var(--line);stroke-width:.6}
svg.chart .bar1{fill:var(--accent)}svg.chart .tg{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
svg.chart .ln{stroke:var(--accent);stroke-width:2.2;fill:none}svg.chart .dot{fill:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:90%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:9px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--accent);color:var(--ink)}
.dots{display:flex;gap:5px;justify-content:center;margin:2px 0 12px}.dots i{height:5px;flex:1;max-width:36px;border-radius:9px;background:var(--surface2)}.dots i.on{background:var(--accent)}.dots i.cur{background:var(--accent2)}
.lv{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#041424;font-family:var(--fd);font-size:24px;font-weight:800;box-shadow:0 0 0 4px var(--glow)}
.badges{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;margin-top:14px}
.bdg{text-align:center;font-size:10.5px;line-height:1.2;color:var(--muted)}.bdg i{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 5px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface2)}
.bdg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdg.on{color:var(--text)}.bdg.on i{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#041424}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:600;font-size:11.5px}
.calh{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px;text-align:center;font-size:11px;color:var(--muted);font-weight:700}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cd{position:relative;aspect-ratio:1/1.08;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0}
.cd span{font-family:var(--fd);font-weight:600;font-size:14px}.cd small{font-size:10.5px;font-weight:800;color:var(--accent);min-height:12px}
.cd.ext small{color:var(--muted);font-weight:600}.cd.off{opacity:.35}
.cd.tod{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cd.dn{background:var(--accent);border-color:var(--accent)}.cd.dn span,.cd.dn small{color:var(--ink)}
.cd.fl::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.mkd{position:absolute;bottom:4px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--good)}
.seg.scroll{overflow-x:auto;grid-auto-columns:minmax(max-content,1fr);scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}.seg.scroll button{padding:9px 12px;white-space:nowrap;font-size:12px}
.stbl{display:grid;grid-template-columns:44px 1fr 1.3fr;gap:3px 10px;font-size:13px;margin-top:6px;align-items:baseline}.stbl .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.stbl b{font-size:15px;font-family:var(--fd)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pgrid button{display:block;text-align:left}
.pimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--surface2);display:block}
.seg.five button{font-size:11.5px;padding:9px 0}
.iconbtn:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.exbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.exbar::-webkit-scrollbar{display:none}
.exc{flex:0 0 auto;min-width:96px;max-width:150px;text-align:left;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card,rgba(255,255,255,.7));color:inherit;font:inherit;line-height:1.25}
.exc .t{display:block;font-weight:700;font-size:13px}.exc .s{display:block;font-size:11px;opacity:.7;margin-top:2px}
.exc.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}.exc.beg .s{color:var(--accent);opacity:1}.exc.fin{opacity:.75}.exc.fin .s{color:var(--good);opacity:1}.exc.add{min-width:64px;text-align:center}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}
</style>
</head>

const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

function applyTheme(){const r=document.documentElement;r.classList.toggle('ph',S.photo!==false);if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}

function defPlan(d){const wd=parse(d).getDay(),sl=SLOT[wd];if(sl===undefined)return DEFPLAN[wd];const w=Math.floor(diffD(d,PREF)/7),i=w*3+sl;return ((i%2)+2)%2===0?'A':'B'}
const planOf=d=>(S.days[d]||{}).plan||defPlan(d);

/* ============ PROGRAMME ============ */
function weekNo(d){return Math.floor(diffD(d,S.start)/7)+1}
function doneAB(){return S.sessions.filter(x=>x.type==='A'||x.type==='B')}
function buildItems(type,mode){
  if(type==='M')return[];
  let ids,sets=null,home=false,rest=null;
  if(mode==='minimum'){ids=LISTS.MIN;sets=2;home=true;rest=30}
  else if(mode==='express'){ids=LISTS.X;sets=2;rest=60}
  else{ids=type==='X'?LISTS.X:(LISTS[type]||LISTS.A);if(type==='X')sets=2;if(mode==='maison'){home=true;rest=60}}
  return ids.map(id=>{const e=EX[id];const n=sets||e.sets;return{id,home,alt:'',n,rest:rest||e.rest,sets:Array.from({length:n},()=>({kg:'',reps:'',done:false}))}});
}
function estMin(type,mode){if(type==='M')return 10;const it=buildItems(type,mode);let s=300;it.forEach(x=>{s+=x.n*(40+x.rest)});return Math.round(s/60/5)*5}
function lastSets(id,home){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex&&S.sessions[i].ex[id];if(e&&!!e.home===!!home&&e.sets.some(s=>s.done))return e.sets.filter(s=>s.done)}return null}
function suggest(id,home){const e=EX[id];const rr=home?e.home.rep:e.rep;const ls=lastSets(id,home);
  if(!ls)return{kg:'',txt:home?'Première fois : choisis une difficulté qui laisse 2 répétitions en réserve.':'Séance test : une charge qui laisse 2 répétitions en réserve.'};
  const top=Math.max(...ls.map(s=>num(s.kg)||0));const all=ls.every(s=>(num(s.reps)||0)>=rr[1]);
  if(e.assist&&!home){
    if(all){const k=Math.max(0,top-e.inc);return{kg:k,txt:`Tu as atteint ${rr[1]} reps partout : baisse l’assistance à ${f1(k)} kg.`}}
    return{kg:top,txt:`Dernière fois ${f1(top)} kg d’assistance. Vise ${rr[1]} reps sur chaque série, puis baisse l’assistance.`}}
  if(all&&!home){const k=top+e.inc;return{kg:k,txt:`Tu as atteint ${rr[1]} reps partout : passe à ${f1(k)} kg.`}}
  if(all&&home)return{kg:top,txt:'Haut de fourchette atteint : passe à la variante plus difficile ou rajoute du poids.'};
  return{kg:top,txt:`Dernière fois ${f1(top)} kg. Vise ${rr[1]} reps sur chaque série avant d’augmenter.`};
}
function startSession(date,type,mode,opts){
  opts=opts||{};
  const items=buildItems(type,mode);
  items.forEach(it=>{const s=suggest(it.id,it.home);it.sets.forEach(x=>{if(s.kg!=='')x.kg=s.kg})});
  S.draft={date,type,mode,items,idx:0,t0:Date.now(),warm:[],mob:[],rpe:0,fin:false};
  dayRec(date).plan=type;dayRec(date).mode=mode;
  if(opts.warmOnly)S.draft.warmOnly=true;
  UI.running=true;persist();render();
}

function bars(items,o){ // items [{l,v}]
  const W=320,H=150,L=28,R=8,T=14,B=24;const vals=items.map(i=>i.v).filter(v=>v!=null);
  let lo=o.min!=null?o.min:0,hi=o.max!=null?o.max:Math.max(...vals,o.target||0,1)*1.15;
  if(!isFinite(hi)||hi<=lo)hi=lo+1;
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));const bw=(W-L-R)/items.length;
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${o.fmt?o.fmt(v):Math.round(v)}</text>`}
  items.forEach((it,i)=>{const x=L+i*bw+bw*.18;const w=bw*.64;
    if(it.v!=null)g+=`<rect class="bar1" x="${x}" y="${y(Math.max(it.v,lo))}" width="${w}" height="${Math.max(2,y(lo)-y(Math.max(it.v,lo)))}" rx="4"/>`;
    g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(it.l)}</text>`;});
  if(o.line){const pts=o.line.map((v,i)=>v==null?null:[L+i*bw+bw/2,y(v)]).filter(Boolean);if(pts.length>1)g+=`<polyline class="tg" points="${pts.map(p=>p.join(',')).join(' ')}"/>`}
  if(o.target!=null)g+=`<line class="tg" x1="${L}" x2="${W-R}" y1="${y(o.target)}" y2="${y(o.target)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'graphique')}">${g}</svg>`;
}
function lineC(items,o){
  const W=320,H=140,L=28,R=10,T=12,B=22;const vs=items.map(i=>i.v).filter(v=>v!=null);
  if(vs.length<1)return '<p class="muted small">Pas encore de données.</p>';
  let lo=Math.min(...vs)-3,hi=Math.max(...vs)+3;const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));const st=items.length>1?(W-L-R)/(items.length-1):0;
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${Math.round(v)}</text>`}
  const pts=items.map((it,i)=>it.v==null?null:[L+i*st+(items.length===1?(W-L-R)/2:0),y(it.v)]);
  const ok=pts.filter(Boolean);if(ok.length>1)g+=`<polyline class="ln" points="${ok.map(p=>p.join(',')).join(' ')}"/>`;
  ok.forEach(p=>g+=`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`);
  items.forEach((it,i)=>{if(i%Math.ceil(items.length/7)===0)g+=`<text x="${L+i*st}" y="${H-6}" text-anchor="middle">${esc(it.l)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'courbe')}">${g}</svg>`;
}
function ring(v,max,label,unit){const p=Math.min(1,v/max);const c=2*Math.PI*24;

const LVL=[0,150,400,750,1200,1800,2500,3300,4200,5200],LVN=['Départ','Régulier','Engagé','Solide','Affûté','Costaud','Discipliné','Imposant','Maître','Légende'];
const BIC={star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',flame:'<path d="M12 22c4 0 7-2.8 7-7 0-3-2-5-3-7-1 2-2 2.5-3 2.5 0-3-1-6-4-8 0 4-4 6-4 12 0 4.2 3 7.5 7 7.5z"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',down:'<path d="M12 4v14M6 12l6 6 6-6"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',trophy:'<path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v2a3 3 0 003 3M16 6h4v2a3 3 0 01-3 3M12 14v4M8 20h8"/>'};
function gameStats(){
  const ss=S.sessions,n=ss.length,wk={};
  ss.forEach(x=>{if(x.type==='M')return;const w=mondayOf(x.date);wk[w]=(wk[w]||0)+1});
  let xp=0;ss.forEach(x=>{xp+=x.type==='M'?20:x.mode==='minimum'?70:100});
  Object.keys(S.m).forEach(d=>{if(S.m[d].w!=null)xp+=10});
  Object.keys(wk).forEach(w=>{if(wk[w]>=3)xp+=50});
  let lv=0;for(let i=0;i<LVL.length;i++)if(xp>=LVL[i])lv=i;
  const last=lv>=LVL.length-1,lo=LVL[lv],hi=last?lo:LVL[lv+1];
  let w=mondayOf(today()),cur=(wk[w]||0)>=2?1:0;w=addD(w,-7);
  while((wk[w]||0)>=2&&cur<300){cur++;w=addD(w,-7)}
  const keys=Object.keys(wk).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{if((wk[k]||0)>=2){run=(prev&&diffD(k,prev)===7)?run+1:1;best=Math.max(best,run);prev=k}else{run=0;prev=null}});
  const wd=Object.keys(S.m).filter(d=>S.m[d].w!=null).sort();
  const loss=wd.length>1?Number(S.m[wd[0]].w)-Number(S.m[wd[wd.length-1]].w):0;
  const bd=[['1re séance','star',n>=1],['5 séances','bolt',n>=5],['10 séances','bolt',n>=10],['20 séances','trophy',n>=20],['Semaine pleine','cal',Object.values(wk).some(c=>c>=3)],['4 semaines','flame',best>=4],['Même fatigué','moon',ss.some(x=>x.mode==='minimum')],['À la maison','home',ss.some(x=>x.mode==='maison')],['−1 kg','down',loss>=1],['−3 kg','down',loss>=3]];
  return {xp,lv,name:LVN[lv],lo,hi,last,streak:cur,best,bd,n};
}
function gameCard(){
  const g=gameStats(),pct=g.last?100:Math.round((g.xp-g.lo)/(g.hi-g.lo)*100);
  return `<div class="card" style="margin-top:12px"><div class="row" style="gap:14px"><div class="lv">${g.lv+1}</div><div class="grow"><div class="row sp"><b style="font-family:var(--fd);font-size:18px">${esc(g.name)}</b><span class="small muted">${g.xp} XP</span></div><div class="bar" style="margin:8px 0 6px"><i style="width:${pct}%"></i></div><div class="tiny muted">${g.last?'Niveau maximum atteint':(g.hi-g.xp)+' XP avant « '+LVN[g.lv+1]+' »'}</div></div></div>
  <div class="row sp" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><svg class="i" viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${BIC.flame}</svg><div><b>${g.streak} ${g.streak>1?'semaines tenues':'semaine tenue'}</b><div class="tiny muted">2 séances ou plus dans la semaine · record ${g.best}</div></div></div></div>
  <div class="badges">${g.bd.map(b=>`<div class="bdg ${b[2]?'on':''}"><i><svg viewBox="0 0 24 24">${BIC[b[1]]}</svg></i>${esc(b[0])}</div>`).join('')}</div>
  <p class="tiny muted" style="margin-top:12px">Séance : 100 XP (70 en version minimum) · pesée : 10 XP · semaine à 3 séances : +50 XP</p></div>`}

  const total=steps.length;const cur=Math.min(D.idx,total-1);

  const st=steps[cur];

    h+=nav(cur,total,'Commencer');return h}
  if(st==='mob'){h+=MOB.map((m,i)=>`<button class="card chk ${D.mob[i]?'on':''}" style="margin-bottom:10px;border-radius:18px" data-a="mob" data-i="${i}"><span class="box"></span><span><b>${esc(m.n)}</b><br><span class="small muted">${esc(m.d)} · ${esc(m.m)}</span></span></button>`).join('');h+=nav(cur,total,'Suivant');return h}
  if(st==='end'){
    const sum=summary(D);
    h+=`<div class="card hero"><h3 style="font-size:24px">Bilan</h3><div class="kpis" style="margin-top:14px">${D.type==='M'?`<div class="kpi"><div class="big">${MOB.filter((_,i)=>D.mob&&D.mob[i]).length}/${MOB.length}</div><small>mouvements</small></div><div class="kpi"><div class="big">${sum.min}</div><small>minutes</small></div>`:`<div class="kpi"><div class="big">${sum.sets}</div><small>séries</small></div><div class="kpi"><div class="big">${Math.round(sum.vol)}</div><small>kg soulevés</small></div><div class="kpi"><div class="big">${sum.min}</div><small>minutes</small></div>`}</div></div>
    ${D.type==='M'?'':'<h2>Ce que tu as soulevé</h2>'}<div class="card" ${D.type==='M'?'hidden':''}>${D.items.map(q=>{const t=setsTxt(q.sets);if(!t)return '';const ee=EX[q.id];return `<div style="padding:8px 0;border-top:1px solid var(--line)"><b class="small">${esc(q.alt||(q.home?ee.home.n:ee.n))}</b>${setsTable(q.sets,ee.assist&&!q.home)}</div>`}).join('')||'<p class="muted small">Aucune série validée.</p>'}</div>
    <div class="note" style="margin-top:12px">${esc(pickQ('finish',D.date+D.items.length))}</div><h2>Effort ressenti</h2><div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${D.rpe===n?'on':''}" data-a="rpe" data-n="${n}">${n}${['','  facile','  correct','  solide','  dur','  max'][n]}</button>`).join('')}</div>
    <p class="small muted" style="margin:6px 2px">Après : 2 œufs dans les 2 heures, et note ton poids du lendemain à jeun.</p>
    <div class="stack" style="margin-top:12px"><button class="btn pri block" data-a="save">Enregistrer la séance</button><button class="btn ghost block" data-a="back">Retour</button></div>`;
    return h}
  const it=D.items[st],e=EX[it.id];const rr=it.home?e.home.rep:e.rep;const sg=suggest(it.id,it.home);
  const name=it.home?e.home.n:(it.alt||e.n);
  h+=`<div class="card hero"><div class="row sp"><span class="tag">${it.home?'Variante maison':'Salle'}</span><span class="tiny muted">Exercice ${st+1} sur ${D.items.length}</span></div><h3 style="font-size:23px;margin:10px 0 4px">${esc(name)}</h3>${it.alt&&!it.home?`<div class="small muted">à la place de ${esc(e.n)}</div>`:''}<p class="muted small">${it.n} × ${e.label&&!it.home?'max':rr.join('-')} · repos ${it.rest} s${e.tempo?'':''}</p><div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap">${e.p.map(m=>`<span class="tag p">${MUSC[m]}</span>`).join('')}${e.s.map(m=>`<span class="tag s">${MUSC[m]}</span>`).join('')}</div>${bodySVG(e.p,e.s)}</div>`;
  {const lr=it.alt?null:lastRec(it.id,it.home);
   h+=`<div class="card" style="margin:12px 0 6px;padding:12px 14px"><div class="row sp"><b class="small">${lr?'La dernière fois':'Première fois'}</b>${lr?`<span class="tiny muted">${esc(fr(lr.date,{weekday:'long',day:'numeric',month:'short'}))}</span>`:''}</div>${lr?`${setsTable(lr.sets,e.assist&&!it.home)}${e.assist&&!it.home?'<div class="tiny muted" style="margin-top:6px">Assistance : moins de kg = plus dur.</div>':''}`:`<p class="small muted" style="margin-top:6px">Note tes charges ici : la prochaine fois, tu verras exactement ce que tu as fait. Choisis une charge qui laisse 2 répétitions en réserve.</p>`}</div>`}

  {const lh=loadHint(it,e,rr);h+=lh?`<div class="note" style="margin-top:10px"><b>Ta charge</b><div class="small" style="margin-top:3px">${esc(lh)}</div></div>`:`<p class="tiny muted" style="margin:10px 4px 0">Repère : ${rr[0]} à ${rr[1]} répétitions propres. Moins de ${rr[0]} : trop lourd. Plus de ${rr[1]+1} sans effort : trop léger.</p>`}
  h+=`<div class="grid2" style="margin-top:12px"><button class="btn sec sm" data-a="altsheet" data-ex="${st}">${ic('swap')}Machine prise ?</button><button class="btn sec sm" data-a="exinfo" data-id="${it.id}">${ic('info')}Technique</button></div>`;
  h+=nav(cur,total,cur===total-2?'Terminer':'Exercice suivant');return h;
}
function exBar(D,cur){const sn=t=>{t=String(t).replace(/\(.*?\)/g,'').trim();return t.length>16?t.slice(0,15)+'…':t};
  return `<div class="exbar" role="tablist" aria-label="Mes exercices">${D.items.map((it,i)=>{const nd=it.sets.filter(q=>q.done||num(q.reps)!=null).length,tot=it.sets.length,fin=nd>=tot,on=cur===i+1;
    return `<button class="exc ${on?'on':''} ${fin?'fin':nd?'beg':''}" data-a="goex" data-i="${i}" role="tab" aria-selected="${on}"><span class="t">${esc(sn(itName(it)))}</span><span class="s">${fin?'✓ fait':nd?nd+'/'+tot:'à faire'}</span></button>`}).join('')}<button class="exc add" data-a="addexsheet" aria-label="Ajouter un exercice"><span class="t">+</span><span class="s">Ajouter</span></button></div>`}
function nav(cur,total,label){return `<div class="row" style="margin-top:16px">${cur>0?`<button class="btn sec" data-a="prev">Retour</button>`:''}<button class="btn pri grow" data-a="next">${esc(label)}</button></div>`}
function normSets(sets){sets.forEach(q=>{if(!q.done&&num(q.reps)!=null)q.done=true})}
function summary(D){D.items.forEach(it=>normSets(it.sets));let sets=0,vol=0;D.items.forEach(it=>it.sets.forEach(s=>{if(s.done){sets++;if(!(EX[it.id]&&EX[it.id].assist&&!it.home))vol+=(num(s.kg)||0)*(num(s.reps)||0)}}));const min=Math.max(1,Math.round((Date.now()-D.t0)/60000));return{sets,vol,min}}

function setsTable(sets,asst){const ds=sets.filter(q=>q.done);if(!ds.length)return '';
  return `<div class="stbl"><span class="h">Série</span><span class="h">${asst?'Assistance':'Charge'}</span><span class="h">Répétitions</span>${ds.map((q,i)=>`<span class="muted">${i+1}</span><span><b>${esc(kgf(q.kg))}</b> kg</span><span><b>${esc(q.reps===''?'?':q.reps)}</b> rép.</span>`).join('')}</div>`}
const kgf=v=>String(v===''||v==null?'0':v).replace('.',',');
function exName(id,x){const e=EX[id];return x.alt||(x.home?e.home.n:e.n)}
function setsTxt(sets){return sets.filter(q=>q.done).map(q=>kgf(q.kg)+' × '+(q.reps===''?'?':q.reps)).join('  ·  ')}
function lastRec(id,home){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex&&S.sessions[i].ex[id];if(e&&!!e.home===!!home&&!e.alt&&e.sets.some(q=>q.done))return{date:S.sessions[i].date,sets:e.sets.filter(q=>q.done)}}return null}
function loadHint(it,e,rr){
  const ds=it.sets.filter(q=>q.done&&num(q.reps)!=null);if(!ds.length)return '';
  const r=num(ds[ds.length-1].reps),inc=it.home?0:e.inc,asst=e.assist&&!it.home;
  if(r>=rr[1]+2)return asst?`Trop facile : baisse l’assistance de ${inc} kg.`:it.home?'Trop facile : passe à la variante plus difficile ou ajoute du poids.':`Trop léger : monte de ${String(inc).replace('.',',')} kg à la prochaine série.`;
  if(r>=rr[1])return asst?'Haut de la fourchette : bonne assistance. Tu la baisseras à la prochaine séance.':'Haut de la fourchette : bonne charge. Tu montes la prochaine fois.';
  if(r>=rr[0])return 'Dans la bonne zone : ni trop léger, ni trop lourd.';
  return asst?`Trop dur : augmente l’assistance de ${inc} kg.`:it.home?'Trop dur : choisis une variante plus facile.':`Trop lourd : baisse de ${String(inc).replace('.',',')} kg.`;
}
function mobRecap(sess){
  const rows=(sess.mob&&sess.mob.length)?sess.mob:MOB.map(m=>({n:m.n,d:m.d,m:m.m,done:null}));
  const done=rows.filter(r=>r.done).length;
  return `${sess.mob?`<p class="small" style="margin:0 0 6px"><b>${done} mouvement${done>1?'s':''} sur ${rows.length}</b> faits.</p>`:`<p class="small muted" style="margin:0 0 6px">Cette séance a été enregistrée avant que l’app garde le détail. Voici le programme du jour.</p>`}`+rows.map(r=>`<div style="padding:9px 0;border-top:1px solid var(--line)"><div class="row sp" style="align-items:flex-start"><b class="small">${esc(r.n)}</b>${r.done===true?'<span class="tag" style="color:var(--good)">Fait</span>':r.done===false?'<span class="tag">Non fait</span>':''}</div><div class="small muted" style="margin-top:2px">${esc(r.d)}</div></div>`).join('')}
function recapHtml(sess){
  if(sess.type==='M')return mobRecap(sess);
  if(!sess.ex||!Object.keys(sess.ex).length)return '<p class="muted small">Pas de détail pour cette séance.</p>';
  const out=Object.keys(sess.ex).map(id=>{const x=sess.ex[id];const t=setsTxt(x.sets);if(!EX[id]||!x.sets)return '';if(!t)return `<div style="padding:9px 0;border-top:1px solid var(--line)"><div class="row sp"><b class="small">${esc(exName(id,x))}</b><span class="tag">Non fait</span></div></div>`;return `<div style="padding:9px 0;border-top:1px solid var(--line)"><b class="small">${esc(exName(id,x))}</b>${setsTable(x.sets,EX[id].assist&&!x.home)}</div>`}).join('');
  return out||'<p class="muted small">Pas de série validée.</p>'}
const sessLine=s=>s.manual?'ajoutée à la main':s.type==='M'?s.dur+' min · '+(s.mob?s.mob.filter(r=>r.done).length+' mouvements sur '+s.mob.length:'mobilité'):s.dur+' min · '+s.sets+' séries · '+Math.round(s.vol)+' kg soulevés';
function sdetSheet(k){const x=S.sessions[+k];if(!x)return;openSheet(`<h3 style="font-size:20px">${esc(TYPES[x.type].t)}</h3><p class="muted small" style="margin:4px 0 8px;text-transform:capitalize">${esc(fr(x.date,{weekday:'long',day:'numeric',month:'long'}))} · ${esc(MODES[x.mode])}${x.manual?'':' · '+x.dur+' min'}</p>${recapHtml(x)}<button class="btn pri block" style="margin-top:16px" data-a="okclose">Fermer</button>`)}
function chargesCard(){
  const rows=Object.keys(EX).map(id=>{const e=EX[id];const r=lastRec(id,false);if(!r)return '';let best=null;S.sessions.forEach(ss=>{const q=ss.ex&&ss.ex[id];if(q&&!q.home&&!q.alt)q.sets.filter(z=>z.done).forEach(z=>{const v=num(z.kg);if(v!=null&&(best===null||(e.assist?v<best:v>best)))best=v})});
    return `<div style="padding:9px 0;border-top:1px solid var(--line)"><div class="row sp"><b class="small">${esc(e.n)}</b><span class="tiny muted">${esc(fr(r.date,{day:'numeric',month:'short'}))}</span></div>${setsTable(r.sets,e.assist)}${best!==null?`<div class="tiny muted" style="margin-top:6px">${e.assist?'Assistance la plus basse':'Record de charge'} : <b>${esc(kgf(best))} kg</b></div>`:''}</div>`}).join('');
  return `<div class="card"><b>Mes charges</b><p class="small muted" style="margin:4px 0 0">La dernière fois et ton record, exercice par exercice.</p>${rows||'<p class="muted small" style="margin-top:8px">Dès ta première séance enregistrée, tes charges apparaissent ici.</p>'}</div>`}
function analyzeMob(D,g0,g1){
  const n=MOB.filter((_,i)=>D.mob&&D.mob[i]).length,out={};
  out.l=[n===MOB.length?`Les ${MOB.length} mouvements sont faits.`:`${n} mouvement${n>1?'s':''} sur ${MOB.length}. Même une partie compte : ton dos et tes hanches te disent merci.`,'La mobilité ne se mesure pas en kilos : elle se sent. Ce que tu gagnes, c’est de pouvoir descendre plus bas à la presse et tirer proprement au rowing.'];
  out.n='Prochaine séance de mobilité : fais-la sans forcer, et note si tes hanches ou ton dos te paraissent plus libres.';
  out.e=n===MOB.length?'Mobilité complète. Les séances qu’on ne voit pas sont celles qui protègent les autres.':'Tu as bougé aujourd’hui, c’est ça qui compte.';
  out.gain=g1.xp-g0.xp;out.lvup=g1.lv>g0.lv?g1.name:'';out.unit='mouvements';out.count=n;return out}
function analyzeSession(D,sum,prev,g0,g1,sess){
  if(D.type==='M')return analyzeMob(D,g0,g1);
  const L=[],good=[],focus=[];let planned=0,done=0,first=0;
  D.items.forEach(it=>{
    const e=EX[it.id],nm=it.alt||(it.home?e.home.n:e.n),ds=it.sets.filter(x=>x.done);planned+=it.sets.length;done+=ds.length;
    if(!ds.length)return;
    const kgs=ds.map(x=>num(x.kg)||0),top=(e.assist&&!it.home)?Math.min(...kgs):Math.max(...kgs),tot=ds.reduce((a,x)=>a+(num(x.reps)||0),0);
    const rr=it.home?e.home.rep:e.rep,reached=!it.alt&&ds.length>=2&&ds.every(x=>(num(x.reps)||0)>=rr[1]);
    const pv=it.alt?null:prev[it.id+(it.home?'h':'')];
    const u=(e.assist&&!it.home)?' kg d’assistance':' kg';
    if(!pv){if(!it.alt)first++;return}
    const ptop=(e.assist&&!it.home)?Math.min(...pv.map(x=>num(x.kg)||0)):Math.max(...pv.map(x=>num(x.kg)||0)),ptot=pv.reduce((a,x)=>a+(num(x.reps)||0),0);
    const asst=e.assist&&!it.home;
    if(asst?top<ptop:top>ptop)good.push(nm+' : '+f1(top)+u+' contre '+f1(ptop)+' la dernière fois.');
    else if(top===ptop&&tot>ptot)good.push(nm+' : '+(tot-ptot)+' répétition'+(tot-ptot>1?'s':'')+' de plus au total à '+f1(top)+u+'.');
    if(reached)focus.push(nm+' : '+(asst?'baisse l’assistance':'monte la charge')+' à la prochaine séance.');
  });
  const out={};
  out.l=[];
  out.l.push(done===planned?`Séance complète : ${done} séries sur ${planned} prévues.`:`${done} séries sur ${planned} prévues. Le reste n’est pas perdu, c’est une séance faite quand même.`);
  if(first&&!good.length)out.l.push(`C’était ta séance test : tes charges de départ sont enregistrées (${first} exercice${first>1?'s':''}). À partir de maintenant, on compare à ça.`);
  good.slice(0,3).forEach(x=>out.l.push('Progrès : '+x));
  if(!first&&!good.length&&done)out.l.push('Pas de progrès visible cette fois. C’est normal : une séance sur deux ou trois stagne, la tendance compte.');
  const r=D.rpe;
  if(r>=5)out.l.push('Effort au maximum : à la prochaine séance, garde les mêmes charges et vise la qualité, pas la limite.');
  else if(r===4)out.l.push('Effort dur mais maîtrisé. C’est la bonne zone pour progresser.');
  else if(r>=1&&r<=2)out.l.push('Effort facile à correct : tu avais de la marge. Dès que tu atteins le haut des répétitions, monte la charge.');
  else if(r===3)out.l.push('Effort solide, bien dosé.');
  const wk=mondayOf(D.date),nw=S.sessions.filter(x=>x.type!=='M'&&mondayOf(x.date)===wk).length;
  out.l.push(`Cette semaine : ${nw} séance${nw>1?'s':''} sur 3. Semaines tenues d’affilée : ${g1.streak}.`);
  out.n=focus.length?focus[0]:(done<planned?'Prochaine séance : vise toutes les séries prévues, sans forcer sur la charge.':'Prochaine séance : même charge, vise le haut de la fourchette de répétitions sur chaque série.');
  const n=S.sessions.length;let enc;
  if(n===1)enc='Première séance faite. La plus dure est derrière toi : tu es passé de l’intention à l’action.';
  else if(D.mode==='minimum')enc='Version minimum faite alors que tu étais fatigué. C’est exactement ça, tenir : on ne cherche pas la perfection.';
  else if(D.mode==='maison')enc='Séance à la maison, sans la salle. Tu n’as pas laissé l’excuse gagner, et ça compte autant.';
  else if(nw>=3)enc='Trois séances cette semaine : semaine pleine. Prends ton repos sans culpabilité, il fait partie du travail.';
  else if(g1.streak>=4)enc=`${g1.streak} semaines d’affilée. Ce n’est plus de la motivation, c’est devenu ton rythme.`;
  else enc=['Tu es venu, tu as travaillé, tu as noté. Voilà ce qui change un corps.','Une séance de plus dans le carnet. Les résultats viennent de la répétition.','Solide. Chaque séance tenue rend la prochaine plus facile à commencer.'][n%3];
  out.e=enc;
  out.gain=g1.xp-g0.xp;out.lvup=g1.lv>g0.lv?g1.name:'';
  return out;
}

  <h2 style="margin-top:16px">Mon analyse</h2><div class="card">${an.l.map(x=>`<p class="small" style="margin:0 0 8px">${esc(x)}</p>`).join('')}</div>

  el.innerHTML=`<div><div class="grow"><div class="tiny" style="font-weight:700">REPOS</div><b id="rt">${mmss(left)}</b></div><button data-a="r-15">−15 s</button><button data-a="r+15">+15 s</button><button data-a="rskip">Passer</button></div>`}
let tick=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.5);o.start();o.stop(actx.currentTime+.5)}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function startRest(s){UI.rest={end:Date.now()+s*1000};updateRestBar();clearInterval(tick);tick=setInterval(()=>{if(!UI.rest){clearInterval(tick);return}
  const left=(UI.rest.end-Date.now())/1000;const rt=$('#rt');if(rt)rt.textContent=mmss(left);if(left<=0){beep();UI.rest=null;updateRestBar();clearInterval(tick)}
  const ck=$('#clock');if(ck&&S.draft)ck.textContent=mmss((Date.now()-S.draft.t0)/1000)},250)}
function stopRest(){UI.rest=null;updateRestBar()}

function act(a,d,el){
  const D=S.draft;
  switch(a){
  case 'tab':UI.tab=d.t;render();window.scrollTo(0,0);break;
  case 'theme':S.theme=document.documentElement.getAttribute('data-theme')==='light'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: light)').matches)?'dark':'light';persist();render();break;
  case 'themeset':S.theme=d.v;persist();render();break;
  case 'mode':{const t=today();dayRec(t).mode=d.m;dayRec(t).chk={};persist();render();break}
  case 'plan':{const t=today();dayRec(t).plan=d.p;dayRec(t).chk={};persist();render();break}
  case 'chk':{const r=dayRec(today());r.chk=r.chk||{};r.chk[d.i]=!r.chk[d.i];persist();render();break}
  case 'start':startSession(today(),planOf(today()),modeOf(today()));break;
  case 'freeload':{dayRec(today()).plan='A';persist();render();break}
  case 'startfrom':{const t=today();startSession(t,d.p,modeOf(t));break}
  case 'resume':UI.running=true;render();break;
  case 'procras':openSheet('');procrasSheet();break;
  case 'warm5':{closeSheet();const t=today();let ty=planOf(t);if(ty==='R'||ty==='M')ty='A';startSession(t,ty,modeOf(t),{warmOnly:true});break}
  case 'gomin':{closeSheet();const t=today();let ty=planOf(t);if(ty==='R'||ty==='M')ty='A';startSession(t,ty,'minimum');break}
  case 'shift':{closeSheet();const t=today(),ty=planOf(t),tm=addD(t,1);dayRec(tm).plan=ty;dayRec(t).plan='R';persist();render();toast('Séance décalée à demain');break}
  case 'ex':exSheet(d.id);break;
  case 'exinfo':exSheet(d.id);break;
  case 'quote':UI.qo=(UI.qo||0)+1;render();break;
  case 'tocal':UI.tab='track';UI.sub='cal';render();window.scrollTo(0,0);break;
  case 'startnow':S.start=today();persist();render();toast('Le plan démarre aujourd’hui');break;
  case 'cm':UI.cm=d.m;render();break;
  case 'cday':if(d.d<RS)toast('Avant le 17 octobre 2026');else calSheet(d.d);break;
  case 'cplan':{dayRec(d.d).plan=d.p;dayRec(d.d).chk={};persist();render();calSheet(d.d);break}
  case 'cmode':{dayRec(d.d).mode=d.m;dayRec(d.d).chk={};persist();render();calSheet(d.d);break}
  case 'cstart':S.start=d.d;persist();closeSheet();render();toast('Le plan démarre le '+fr(d.d));break;
  case 'addmd':addmSheet(d.d);break;
  case 'cdone':{const dt=d.d;if(S.sessions.some(x=>x.date===dt&&!x.manual)){toast('Séance déjà enregistrée dans l’appli');break}
    const mi=S.sessions.findIndex(x=>x.date===dt&&x.manual);
    if(mi>=0){S.sessions.splice(mi,1);dayRec(dt).done=false}
    else{let ty=planOf(dt);if(ty==='R')ty='X';S.sessions.push({date:dt,type:ty,mode:modeOf(dt),dur:0,vol:0,sets:0,rpe:0,ex:{},manual:true});dayRec(dt).done=true}
    persist();render();calSheet(dt);break}
  case 'mus':UI.mus=d.m;render();break;
  case 'sub':UI.sub=d.s;render();break;
  case 'addm':addmSheet();break;
  case 'savem':{const dt=$('#md').value||today();const rec={...(S.m[dt]||{})};
    MF.forEach(([id,k])=>{const v=num($('#'+id).value);if(v!=null)rec[k]=v;else if($('#'+id).value.trim()==='')delete rec[k]});
    {const sh=num($('#msh').value),sm=num($('#msm').value);if(sh!=null||sm!=null)rec.sleep=Math.round(((sh||0)+Math.min(59,sm||0)/60)*10000)/10000;else delete rec.sleep;const bd=$('#mb').value;if(bd)rec.bed=bd;else delete rec.bed}
    S.m[dt]=rec;persist();closeSheet();render();toast('Mesures enregistrées');break}
  case 'export':{const txt=JSON.stringify(S);openSheet(`<h3 style="font-size:20px">Exporter</h3><p class="muted small" style="margin:6px 0 10px">Copie ce texte et garde-le (notes, mail). Tu pourras le coller dans Importer.</p><textarea id="ex" readonly>${esc(txt)}</textarea><div class="grid2" style="margin-top:12px"><button class="btn pri" data-a="copyex">Copier</button><button class="btn sec" data-a="dlex">Enregistrer</button></div>`);break}
  case 'copyex':{const t=$('#ex');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copié'),()=>toast('Sélectionné : copie à la main'))}catch(e){toast('Sélectionné : copie à la main')}break}
  case 'dlex':window.claude&&window.claude.use&&window.claude.use('downloads').then(dl=>{if(!dl){toast('Enregistrement indisponible ici, utilise Copier');return}return dl.save({filename:'kotrana-sauvegarde.json',data:JSON.stringify(S)})}).catch(()=>toast('Enregistrement refusé'));break;
  case 'import':openSheet(`<h3 style="font-size:20px">Importer</h3><p class="muted small" style="margin:6px 0 10px">Choisis ton fichier de sauvegarde, ou colle son texte. Il remplacera tes données actuelles.</p><label class="btn sec block" style="cursor:pointer;margin-bottom:10px">Choisir le fichier de sauvegarde<input id="imf" type="file" style="position:absolute;width:1px;height:1px;opacity:0"></label><div id="imi" class="small muted" style="margin-bottom:8px"></div><textarea id="im" placeholder="ou colle le texte ici"></textarea><button class="btn pri block" style="margin-top:12px" data-a="doimport">Importer</button>`);break;
  case 'doimport':try{const raw=String($('#im').value||'').replace(/^\uFEFF/,'').trim();const o=JSON.parse(raw);if(!o||typeof o!=='object'||o.v!==1||!Array.isArray(o.sessions))throw 0;const base=fresh();Object.keys(base).forEach(k=>{if(o[k]==null)o[k]=base[k]});S=fixStart(o);persist();closeSheet();render();toast('Données importées : '+S.sessions.length+' séance'+(S.sessions.length>1?'s':''))}catch(e){toast('Sauvegarde invalide. Choisis le fichier kotrana-sauvegarde.json')}break;
  case 'reset':openSheet(`<h3 style="font-size:20px">Tout effacer ?</h3><p class="muted" style="margin:6px 0 14px">Séances, mesures et réglages seront supprimés.</p><div class="grid2"><button class="btn sec" data-a="closesheet" data-x="1">Annuler</button><button class="btn pri" style="background:var(--bad)" data-a="doreset">Effacer</button></div>`);break;
  case 'doreset':S=fresh();persist();closeSheet();UI.tab='today';render();break;
  /* séance */
  case 'leave':openSheet(`<h3 style="font-size:20px">Quitter la séance ?</h3><p class="muted" style="margin:6px 0 14px">Tu peux la reprendre plus tard : elle est gardée.</p><div class="stack"><button class="btn pri block" data-a="pause">Mettre en pause</button><button class="btn ghost block" style="color:var(--bad)" data-a="drop">Abandonner cette séance</button></div>`);break;
  case 'pause':closeSheet();UI.running=false;stopRest();render();break;
  case 'drop':closeSheet();S.draft=null;UI.running=false;stopRest();persist();render();break;
  case 'warm':D.warm[d.i]=!D.warm[d.i];persist();render();break;
  case 'mob':D.mob[d.i]=!D.mob[d.i];persist();render();break;
  case 'next':{if(D.warmOnly&&D.idx===0){D.warmOnly=false;openSheet(`<h3 style="font-size:20px">Échauffé ?</h3><p class="muted" style="margin:6px 0 14px">5 minutes faites. Tu continues avec la séance ?</p><div class="stack"><button class="btn pri block" data-a="closesheet" data-x="1">Oui, je continue</button><button class="btn ghost block" data-a="drop">Non, c’est assez pour aujourd’hui</button></div>`)}
    D.idx++;stopRest();persist();render();window.scrollTo(0,0);break}
  case 'prev':D.idx=Math.max(0,D.idx-1);persist();render();window.scrollTo(0,0);break;
  case 'setdone':{const it=D.items[d.ex],s=it.sets[d.s];s.done=!s.done;if(s.done&&s.reps===''){const l0=it.alt?null:lastRec(it.id,it.home);s.reps=l0&&l0.sets[d.s]?l0.sets[d.s].reps:(it.home?EX[it.id].home.rep[1]:EX[it.id].rep[1])}persist();render();if(s.done)startRest(it.rest);else stopRest();break}
  case 'addset':{const it=D.items[d.ex];const l=it.sets[it.sets.length-1];it.sets.push({kg:l?l.kg:'',reps:'',done:false});persist();render();break}
  case 'delset':{const it=D.items[d.ex];if(it.sets.length>1)it.sets.pop();persist();render();break}
  case 'altsheet':altSheet(+d.ex);break;
  case 'pickalt':{const it=D.items[d.ex];it.alt=EX[it.id].alt[d.k];it.home=false;persist();closeSheet();render();toast('Alternative choisie');break}
  case 'gohome':{const it=D.items[d.ex];it.home=true;it.alt='';const sg=suggest(it.id,true);it.sets.forEach(s=>{s.kg=sg.kg});persist();closeSheet();render();break}
  case 'resetalt':{const it=D.items[d.ex];it.home=false;it.alt='';const sg=suggest(it.id,false);it.sets.forEach(s=>{s.kg=sg.kg});persist();closeSheet();render();break}
  case 'r-15':if(UI.rest){UI.rest.end=Math.max(Date.now(),UI.rest.end-15000);updateRestBar()}break;
  case 'r+15':if(UI.rest){UI.rest.end+=15000;updateRestBar()}break;
  case 'rskip':stopRest();break;
  case 'rpe':D.rpe=+d.n;persist();render();break;
  case 'back':D.idx=Math.max(0,D.idx-1);render();break;
  case 'okclose':closeSheet();break;
  case 'myex':planSheet();break;
  case 'goex':{closeSheet();D.idx=1+(+d.i);persist();render();window.scrollTo(0,0);{const c=document.querySelector('.exc.on');if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'})}break}
  case 'rmex':{if(D.items.length>1&&!D.items[+d.i].sets.some(q=>q.done||num(q.reps)!=null)){D.items.splice(+d.i,1);if(D.idx>D.items.length)D.idx=D.items.length;persist();render();planSheet()}break}
  case 'addexsheet':pickSheet('add',null);break;
  case 'swapsheet':pickSheet('swap',+d.ex);break;
  case 'customsheet':customSheet(d.mode,d.i===''?null:+d.i);break;
  case 'pickex':{const id=d.id;let mode=d.mode,i=d.i===''?null:+d.i;
    if(mode==='swap'&&D.items[i].sets.some(q=>q.done||num(q.reps)!=null))mode='add';
    if(mode==='swap'){D.items[i]=makeItem(id,false);D.idx=1+i}else{D.items.push(makeItem(id,false));D.idx=D.items.length}
    persist();closeSheet();render();window.scrollTo(0,0);toast('Exercice ajouté');break}
  case 'savecustom':{const nm=($('#cn').value||'').trim();if(!nm){toast('Écris le nom de l’exercice');break}
    const mu=$('#cm').value,ns=Math.max(1,Math.min(8,Math.round(num($('#cs').value)||3)));
    const id='c'+Date.now().toString(36);
    const ex={n:nm,rep:[8,12],sets:ns,rest:90,inc:2.5,p:[mu],s:[],mech:'Exercice ajouté par toi. Choisis une charge qui laisse 2 répétitions en réserve.',cues:['Mouvement contrôlé, amplitude complète','Respire : souffle à l’effort'],err:['Charge trop lourde qui casse la technique'],why:'Exercice choisi par toi parce que les autres étaient pris. Note tes charges pour progresser.',alt:[],home:{n:nm,how:'',load:'Charge (kg)',rep:[8,12],prog:'Ajoute des répétitions, puis de la charge.'},yt:nm+' technique'};
    EX[id]=ex;S.custom=S.custom||{};S.custom[id]=ex;
    let mode=d.mode,i=d.i===''?null:+d.i;if(mode==='swap'&&D.items[i].sets.some(q=>q.done||num(q.reps)!=null))mode='add';
    if(mode==='swap'){D.items[i]=makeItem(id,false,ns);D.idx=1+i}else{D.items.push(makeItem(id,false,ns));D.idx=D.items.length}
    persist();closeSheet();render();window.scrollTo(0,0);toast('Exercice ajouté');break}
  case 'sdet':sdetSheet(d.k);break;
  case 'padd':padSheet();break;
  case 'pang':UI.pa=d.v;render();break;
  case 'pview':pviewSheet(d.id);break;
  case 'pdel':photoDel(d.id);break;
  case 'photoset':S.photo=d.v==='1';persist();render();break;
  case 'save':{const sum=summary(D);const prevSets={};D.items.forEach(it=>{prevSets[it.id+(it.home?'h':'')]=lastSets(it.id,it.home)});const g0=gameStats();const ex={};D.items.forEach(it=>{ex[it.id]={home:it.home,alt:it.alt,sets:it.sets.map(s=>({kg:s.kg,reps:s.reps,done:s.done}))}});
    const mobL=D.type==='M'?MOB.map((m,i)=>({n:m.n,d:m.d,done:!!(D.mob&&D.mob[i])})):null;
    S.sessions.push({date:D.date,type:D.type,mode:D.mode,dur:sum.min,vol:sum.vol,sets:sum.sets,rpe:D.rpe,ex,mob:mobL});
    dayRec(D.date).done=true;const Dd=D;S.draft=null;UI.running=false;stopRest();UI.tab='today';
    let an=null;try{an=analyzeSession(Dd,sum,prevSets,g0,gameStats())}catch(e){}
    if(an)S.sessions[S.sessions.length-1].an={e:an.e,l:an.l,n:an.n};
    persist();render();if(an)analysisSheet(an,sum);else toast(doneMsg());break}
  }
}
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');if(!a)return;
  if(a.dataset.a==='closesheet'){if(e.target.closest('.sheet')&&!a.dataset.x)return;closeSheet();return}
  act(a.dataset.a,a.dataset,a);
},false);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;const q=t.value.toLowerCase();const keys=Object.keys(EX).filter(id=>{const x=EX[id];return(!UI.mus||x.p.includes(UI.mus)||x.s.includes(UI.mus))&&(!q||(x.n+' '+x.home.n+' '+x.p.map(m=>MUSC[m]).join(' ')).toLowerCase().includes(q))});$('#liblist').innerHTML=libList(keys);return}
  if(t.dataset.i&&S.draft){const it=S.draft.items[t.dataset.ex];it.sets[t.dataset.s][t.dataset.i]=t.value;if(t.dataset.i==='reps'){const q=it.sets[t.dataset.s];q.done=num(t.value)!=null;const row=t.closest('.setrow');if(row)row.classList.toggle('done',q.done)}clearTimeout(saveT);saveT=setTimeout(persist,600)}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='sp'){const v=t.value.trim();if(v&&!/^https:\/\/open\.spotify\.com\//.test(v)){toast('Lien Spotify attendu : https://open.spotify.com/…');t.value=S.spotify;return}S.spotify=v;persist();toast('Playlist enregistrée')}
  if(t.id==='why'){S.why=t.value.trim();persist();toast('Enregistré')}
  if(t.id==='cnote'){const dt=t.dataset.d;if(t.value.trim())dayRec(dt).note=t.value.trim();else delete dayRec(dt).note;persist();toast('Note enregistrée')}
  if(t.id==='imf'&&t.files&&t.files[0]){const f=t.files[0],r=new FileReader();r.onload=()=>{const txt=String(r.result||'').replace(/^\uFEFF/,'').trim();$('#im').value=txt;let msg='Fichier lu : '+esc(f.name);try{const o=JSON.parse(txt);if(o&&o.v===1&&Array.isArray(o.sessions))msg+=' · '+o.sessions.length+' séance'+(o.sessions.length>1?'s':'')+'. Touche Importer.';else msg='Ce fichier n’est pas une sauvegarde Kotrana.'}catch(_){msg='Ce fichier n’est pas une sauvegarde Kotrana.'}$('#imi').innerHTML=msg};r.onerror=()=>{$('#imi').textContent='Lecture impossible. Colle le texte à la place.'};r.readAsText(f);t.value=''}
  if(t.id==='pf'&&t.files&&t.files[0]){photoSave(t.files[0],($('#pd').value||today()),$('#pa').value)}
  if(t.id==='pc1'){UI.p1=t.value;render()}
  if(t.id==='pc2'){UI.p2=t.value;render()}
  if(t.id==='st'&&t.value){S.start=t.value;persist();render();toast('Début du plan : '+fr(S.start))}
});
applyTheme();render();initCloud();photosLoad();
</script>
